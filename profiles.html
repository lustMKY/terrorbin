<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>terrorbin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Creepster&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
}

img {
  -webkit-user-drag: none;
  user-select: none;
}

    


  

    /* =========================
       BODY
    ========================= */

    body {
      min-height: 100vh;

      font-family: 'Rajdhani', sans-serif;

      background: #050505;

      color: white;

      display: flex;

      justify-content: center;
      align-items: center;

      padding: 30px;

      overflow: hidden;

      perspective: 1200px;
    }

    /* =========================
       BACKGROUND VIDEO
    ========================= */

    #backgroundVideo {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: -3;

      pointer-events: none;
    }

    /* =========================
       VIDEO OVERLAY
    ========================= */

    .video-overlay {
      position: fixed;

      inset: 0;

      background:
        radial-gradient(
          circle at center,
          rgba(20, 20, 20, 0.35) 0%,
          rgba(0, 0, 0, 0.65) 60%,
          rgba(0, 0, 0, 0.82) 100%
        );

      z-index: -2;

      pointer-events: none;
    }

    /* =========================
       TOP NAVIGATION
       VISIBLE BEFORE ENTER
    ========================= */

    .top-nav {
      position: fixed;

      top: 15px;

      left: 50%;

      transform: translateX(-50%);

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 7px;

      z-index: 10000;

      opacity: 1;
    }

    .nav-button {
      position: relative;

      min-width: 78px;

      height: 38px;

      padding: 0 17px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 10px;

      border:
        1px solid rgba(255, 255, 255, 0.12);

      background:
        rgba(10, 10, 10, 0.32);

      backdrop-filter: blur(10px);

      -webkit-backdrop-filter: blur(10px);

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.35),
        inset 0 0 25px rgba(255, 255, 255, 0.025);

      color: #aaa;

      text-decoration: none;

      font-family: 'Rajdhani', sans-serif;

      font-size: 12px;

      font-weight: 500;

      letter-spacing: 1.5px;

      text-transform: uppercase;

      overflow: hidden;

      transition:
        color 0.35s ease,
        border-color 0.35s ease,
        box-shadow 0.5s ease,
        transform 0.7s ease;
    }

    .nav-button:hover {
      color: white;

      border-color:
        rgba(255, 255, 255, 0.35);

      box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.55),
        0 0 25px rgba(255, 255, 255, 0.08),
        inset 0 0 30px rgba(255, 255, 255, 0.045);

      transform:
        translateY(-4px)
        scale(1.03);

      text-shadow:
        0 0 12px rgba(255, 255, 255, 0.18);
    }

    /* =========================
       NAV SHINE
    ========================= */

    .nav-button::after {
      content: "";

      position: absolute;

      top: -100%;

      left: -80%;

      width: 55%;

      height: 300%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.055),
          transparent
        );

      transform: rotate(20deg);

      pointer-events: none;

      transition:
        left 0.8s ease;
    }

    .nav-button:hover::after {
      left: 125%;
    }

    /* =========================
       NAV GLOW
    ========================= */

    .nav-button::before {
      content: "";

      position: absolute;

      width: 120px;

      height: 120px;

      top: -85px;

      left: 50%;

      transform:
        translateX(-50%);

      border-radius: 50%;

      background: white;

      opacity: 0.025;

      filter: blur(8px);

      transition:
        opacity 0.35s ease,
        transform 0.5s ease;
    }

    .nav-button:hover::before {
      opacity: 0.08;

      transform:
        translateX(-50%)
        scale(1.2);
    }

    /* =========================
       CLICK TO ENTER
    ========================= */

    #enterScreen {
      position: fixed;

      inset: 0;

      z-index: 9999;

      display: flex;

      justify-content: center;
      align-items: center;

      background: rgba(0, 0, 0, 0.72);

      backdrop-filter: blur(3px);

      cursor: pointer;

      opacity: 1;

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }

    #enterScreen.hidden {
      opacity: 0;

      visibility: hidden;

      pointer-events: none;
    }

    .enter-text {
      font-size: 18px;

      font-weight: 500;

      letter-spacing: 4px;

      text-transform: uppercase;

      color: #aaa;

      transition:
        color 0.25s ease,
        transform 0.25s ease,
        text-shadow 0.25s ease;
    }

    #enterScreen:hover .enter-text {
      color: white;

      transform: scale(1.08);

      text-shadow:
        0 0 15px rgba(255,255,255,0.3),
        0 0 35px rgba(255,255,255,0.12);
    }

    /* =========================
       MAIN CONTAINER
    ========================= */

    .container {
      width: 100%;

      max-width: 1250px;

      transform-style: preserve-3d;

      transition:
        transform 0.15s ease-out,
        opacity 0.8s ease;

      opacity: 0;

      pointer-events: none;
    }

    .container.show {
      opacity: 1;

      pointer-events: auto;
    }

    /* =========================
       TITLE
    ========================= */

    .title {
      text-align: center;

      margin-bottom: 35px;

      transform: translateZ(30px);
    }

    .title h1,
    .username {
      font-family: 'Creepster', cursive;
    }

    .title p {
      color: #777;

      font-size: 15px;

      font-weight: 400;

      letter-spacing: 1px;
    }

    /* =========================
       PROFILE ROW
    ========================= */

    .profiles {
      display: flex;

      justify-content: center;

      align-items: center;

      gap: 18px;

      transform-style: preserve-3d;
    }

    /* =========================
       PROFILE CARD
    ========================= */

    .profile {
      position: relative;

      width: 270px;

      min-width: 270px;

      height: 430px;

      padding: 30px 24px;

      border-radius: 18px;

      border:
        1px solid rgba(255, 255, 255, 0.12);

      background:
        rgba(10, 10, 10, 0.28);

      backdrop-filter: blur(10px);

      -webkit-backdrop-filter: blur(10px);

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.35),
        inset 0 0 30px rgba(255, 255, 255, 0.025);

      overflow: hidden;

      text-align: center;

      transform-style: preserve-3d;

      opacity: 0;

      transform:
        translateY(30px)
        translateZ(0)
        rotateX(0deg)
        rotateY(0deg)
        scale(1);

      transition:
        opacity 0.8s ease,
        border-color 0.35s ease,
        box-shadow 0.35s ease;
    }

    .container.show .profile {
      opacity: 1;
    }

    .container.show .profile:nth-child(1) {
      transition-delay: 0.15s;
    }

    .container.show .profile:nth-child(2) {
      transition-delay: 0.25s;
    }

    .container.show .profile:nth-child(3) {
      transition-delay: 0.35s;
    }

    /* =========================
       PROFILE HOVER
    ========================= */

    .profile:hover {
      border-color:
        rgba(255, 255, 255, 0.35);

      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.65),
        0 0 35px rgba(255, 255, 255, 0.08),
        inset 0 0 35px rgba(255, 255, 255, 0.045);
    }

    /* =========================
       MOVING CARD SHINE
    ========================= */

    .profile::after {
      content: "";

      position: absolute;

      top: -100%;

      left: -75%;

      width: 55%;

      height: 300%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.055),
          transparent
        );

      transform: rotate(20deg);

      pointer-events: none;

      transition:
        left 0.8s ease;
    }

    .profile:hover::after {
      left: 125%;
    }

    /* =========================
       CARD GLOW
    ========================= */

    .profile::before {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      top: -90px;
      left: 50%;

      transform:
        translateX(-50%);

      border-radius: 50%;

      background: white;

      opacity: 0.035;

      filter: blur(5px);

      transition:
        opacity 0.35s ease,
        transform 0.5s ease;
    }

    .profile:hover::before {
      opacity: 0.09;

      transform:
        translateX(-50%)
        scale(1.25);
    }

    /* =========================
       AVATAR
    ========================= */

    .avatar {
      display: block;

      width: 90px;
      height: 90px;

      object-fit: cover;

      border-radius: 50%;

      border: 2px solid #333;

      margin:
        0 auto 20px auto;

      position: relative;

      z-index: 2;

      transform:
        translateZ(35px)
        scale(1);

      transition:
        transform 0.35s ease,
        border-color 0.35s ease,
        box-shadow 0.35s ease;
    }

    .profile:hover .avatar {
      transform:
        translateZ(55px)
        scale(1.08);

      border-color: #777;

      box-shadow:
        0 0 25px rgba(255,255,255,0.12);
    }

    /* =========================
       USERNAME
    ========================= */

    .username {
      font-size: 25px;

      font-weight: 600;

      letter-spacing: 0.5px;

      margin-bottom: 5px;

      transform:
        translateZ(25px);

      transition:
        text-shadow 0.35s ease,
        transform 0.35s ease;
    }

    .profile:hover .username {
      transform:
        translateZ(40px);

      text-shadow:
        0 0 12px rgba(255,255,255,0.18);
    }

    /* =========================
       TAG
    ========================= */

    .tag {
      color: #777;

      font-size: 14px;

      font-weight: 400;

      letter-spacing: 0.5px;

      margin-bottom: 22px;

      transform:
        translateZ(20px);

      transition:
        color 0.3s ease,
        transform 0.3s ease;
    }

    .profile:hover .tag {
      color: #aaa;

      transform:
        translateZ(32px);
    }

    /* =========================
       BIO
    ========================= */

    .bio {
      color: #aaa;

      font-size: 15px;

      font-weight: 400;

      line-height: 1.7;

      margin-bottom: 28px;

      transform:
        translateZ(15px);

      transition:
        color 0.3s ease,
        transform 0.3s ease;
    }

    .profile:hover .bio {
      color: #ccc;

      transform:
        translateZ(28px);
    }

    /* =========================
       SOCIALS
    ========================= */

    .links {
      display: flex;

      justify-content: center;

      align-items: center;

      gap: 8px;

      transform:
        translateZ(25px);
    }

    .links a {
      width: 42px;

      height: 42px;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #ddd;

      text-decoration: none;

      font-size: 11px;

      border-radius: 9px;

      background: #191919;

      border: 1px solid #303030;

      transition:
        background 0.25s ease,
        border-color 0.25s ease,
        color 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .links a:hover {
      background: #292929;

      border-color: #555;

      color: white;

      transform:
        translateY(-7px)
        translateZ(30px)
        scale(1.1);

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.5),
        0 0 15px rgba(255, 255, 255, 0.1);
    }

    /* =========================
       LOGOS
    ========================= */

    .discord-logo {
      width: 28px;
      height: 28px;

      object-fit: contain;
    }

    .Telegram-logo {
      width: 28px;
      height: 28px;

      object-fit: contain;
    }

    .Doxbin-logo {
      width: 50px;
      height: 50px;

      object-fit: contain;
    }

    /* =========================
       ONLINE STATUS
    ========================= */

    .status {
      position: absolute;

      top: 20px;

      right: 18px;

      display: flex;

      align-items: center;

      gap: 6px;

      color: #777;

      font-size: 12px;

      font-weight: 400;

      transform:
        translateZ(20px);

      transition:
        color 0.3s ease;
    }

    .profile:hover .status {
      color: #aaa;
    }

    .dot {
      width: 7px;

      height: 7px;

      border-radius: 50%;

      background: #4ade80;

      box-shadow:
        0 0 10px #4ade80;

      animation:
        statusPulse 2s ease-in-out infinite;
    }

    @keyframes statusPulse {

      0%, 100% {
        opacity: 0.65;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.25);
      }

    }

    /* =========================
       DISCORD SERVER BUTTON
    ========================= */

    .server-button-wrapper {
      display: flex;

      justify-content: center;

      margin-top: 28px;

      transform-style: preserve-3d;

      opacity: 0;

      transform:
        translateY(20px);

      transition:
        opacity 0.8s ease,
        transform 0.8s ease;
    }

    .container.show .server-button-wrapper {
      opacity: 1;

      transform:
        translateY(0);

      transition-delay: 0.5s;
    }

    .server-button {
      position: relative;

      width: 220px;

      height: 55px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 14px;

      border:
        1px solid rgba(255, 255, 255, 0.12);

      background:
        rgba(10, 10, 10, 0.28);

      backdrop-filter: blur(10px);

      -webkit-backdrop-filter: blur(10px);

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.35),
        inset 0 0 30px rgba(255, 255, 255, 0.025);

      color: #ddd;

      text-decoration: none;

      font-family: 'Rajdhani', sans-serif;

      font-size: 14px;

      font-weight: 500;

      letter-spacing: 1.5px;

      text-transform: uppercase;

      overflow: hidden;

      transform:
        translateY(0)
        translateZ(0)
        scale(1);

      transition:
        border-color 0.35s ease,
        box-shadow 0.35s ease,
        color 0.35s ease,
        transform 0.7s ease;
    }

    .server-button:hover {
      color: white;

      border-color:
        rgba(255, 255, 255, 0.35);

      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.65),
        0 0 35px rgba(255, 255, 255, 0.08),
        inset 0 0 35px rgba(255, 255, 255, 0.045);

      transform:
        translateY(-6px)
        translateZ(15px)
        scale(1.025);

      text-shadow:
        0 0 12px rgba(255, 255, 255, 0.18);
    }

    /* =========================
       SERVER BUTTON SHINE
    ========================= */

    .server-button::after {
      content: "";

      position: absolute;

      top: -100%;

      left: -75%;

      width: 55%;

      height: 300%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.055),
          transparent
        );

      transform:
        rotate(20deg);

      pointer-events: none;

      transition:
        left 0.8s ease;
    }

    .server-button:hover::after {
      left: 125%;
    }

    /* =========================
       SERVER BUTTON GLOW
    ========================= */

    .server-button::before {
      content: "";

      position: absolute;

      width: 180px;

      height: 180px;

      top: -120px;

      left: 50%;

      transform:
        translateX(-50%);

      border-radius: 50%;

      background: white;

      opacity: 0.035;

      filter: blur(8px);

      transition:
        opacity 0.35s ease,
        transform 0.5s ease;
    }

    .server-button:hover::before {
      opacity: 0.09;

      transform:
        translateX(-50%)
        scale(1.25);
    }

    /* =========================
       MOUSE GLOW
    ========================= */

    .cursor-glow {
      position: fixed;

      width: 550px;

      height: 550px;

      border-radius: 50%;

      pointer-events: none;

      z-index: -1;

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.16) 0%,
          rgba(255, 255, 255, 0.09) 15%,
          rgba(255, 255, 255, 0.055) 30%,
          rgba(255, 255, 255, 0.025) 50%,
          rgba(255, 255, 255, 0.008) 65%,
          transparent 75%
        );

      transform:
        translate(-50%, -50%);

      filter: blur(12px);
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 1150px) {

      body {
        align-items: flex-start;

        padding-top: 60px;

        overflow: auto;
      }

      .profiles {
        flex-wrap: wrap;
      }

    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      body {
        padding: 40px 15px;
      }

      .title h1 {
        font-size: 32px;
      }

      .profiles {
        flex-direction: column;
      }

      .profile {
        width: 270px;
      }

      .server-button {
        width: 270px;
      }

      .top-nav {
        top: 10px;

        gap: 5px;
      }

      .nav-button {
        min-width: 68px;

        height: 35px;

        padding: 0 12px;

        font-size: 10px;
      }

    }

    /* =========================
       TOUCH DEVICES
    ========================= */

    @media (hover: none) {

      .cursor-glow {
        display: none;
      }

      #enterScreen {
        cursor: auto;
      }

      .profile:hover {
        border-color:
          rgba(255, 255, 255, 0.12);

        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.35),
          inset 0 0 30px rgba(255, 255, 255, 0.025);
      }

    }

    /* =========================
       REDUCE MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {

      .dot {
        animation: none;
      }

      .profile::after,
      .server-button::after,
      .nav-button::after {
        display: none;
      }

    }

  </style>
</head>

          </a>

          <a
            href="#"
            title="Telegram"
          >
            <img
              src="TG.webp"
              alt="Telegram"
              class="Telegram-logo"
            >
          </a>

          <a
            href="#"
            title="Doxbin"
          >
            <img
              src="DB.png"
              alt="Doxbin"
              class="Doxbin-logo"
            >
          </a>

        </div>

      </div>

    </div>


    <!-- =========================
         DISCORD SERVER BUTTON
    ========================= -->

    <div class="server-button-wrapper">

      <a
  href="https://discord.gg/AbKPxnz9C"
  class="server-button"
  target="_blank"
  rel="noopener noreferrer"
>
  Discord server
</a>

    </div>

  </div>


  <!-- =========================
       CURSOR GLOW
  ========================= -->

  <div
    class="cursor-glow"
    id="cursorGlow"
  ></div>


  <script>

    /* =========================
       ELEMENTS
    ========================= */

    const scene =
      document.getElementById("scene");

    const cursorGlow =
      document.getElementById("cursorGlow");

    const enterScreen =
      document.getElementById("enterScreen");

    const bgMusic =
      document.getElementById("bgMusic");

    const backgroundVideo =
      document.getElementById("backgroundVideo");

    const profiles =
      document.querySelectorAll(".profile");


    /* =========================
       BACKGROUND VIDEO
    ========================= */

    backgroundVideo.muted = true;

    backgroundVideo.loop = true;

    backgroundVideo.play().catch(() => {});


    /* =========================
       ENTER SCREEN
    ========================= */

    let entered = false;

    enterScreen.addEventListener(
      "click",
      () => {

        if (entered) return;

        entered = true;

        enterScreen.classList.add(
          "hidden"
        );

        scene.classList.add(
          "show"
        );

        bgMusic.volume = 0.35;

        bgMusic.play().catch(() => {});

        backgroundVideo.play().catch(() => {});

      },
      {
        once: true
      }
    );


    /* =========================
       TYPEWRITER EFFECT
    ========================= */

    function typeWriter(
      element,
      speed = 60,
      delay = 0
    ) {

      const text =
        element.textContent.trim();

      element.textContent = "";

      setTimeout(() => {

        let index = 0;

        function type() {

          if (index < text.length) {

            element.textContent +=
              text.charAt(index);

            index++;

            setTimeout(
              type,
              speed
            );

          }

        }

        type();

      }, delay);

    }


    /* =========================
       START TYPEWRITER
    ========================= */

    function startTypewriter() {

      typeWriter(
        document.querySelector(".title h1"),
        80,
        300
      );

      typeWriter(
        document.querySelector(".title p"),
        50,
        800
      );

      profiles.forEach(
        (profile, profileIndex) => {

          const username =
            profile.querySelector(
              ".username"
            );

          const tag =
            profile.querySelector(
              ".tag"
            );

          const bio =
            profile.querySelector(
              ".bio"
            );

          const startDelay =
            1200 +
            profileIndex * 500;

          typeWriter(
            username,
            80,
            startDelay
          );

          typeWriter(
            tag,
            50,
            startDelay + 500
          );

          typeWriter(
            bio,
            45,
            startDelay + 900
          );

        }
      );

    }


    /* =========================
       START TYPEWRITER AFTER ENTER
    ========================= */

    enterScreen.addEventListener(
      "click",
      () => {

        startTypewriter();

      },
      {
        once: true
      }
    );


    /* =========================
       MOUSE POSITION
    ========================= */

    let mouseX =
      window.innerWidth / 2;

    let mouseY =
      window.innerHeight / 2;

    let glowX =
      mouseX;

    let glowY =
      mouseY;


    /* =========================
       CAMERA TILT
    ========================= */

    let targetTiltX = 0;
    let targetTiltY = 0;

    let currentTiltX = 0;
    let currentTiltY = 0;


    document.addEventListener(
      "mousemove",
      (event) => {

        mouseX =
          event.clientX;

        mouseY =
          event.clientY;

        const normalizedX =
          (mouseX /
            window.innerWidth) *
            2 -
          1;

        const normalizedY =
          (mouseY /
            window.innerHeight) *
            2 -
          1;

        targetTiltY =
          normalizedX * 12;

        targetTiltX =
          normalizedY * 8;

      }
    );


    /* =========================
       PROFILE 3D HOVER + FLOAT
    ========================= */

    profiles.forEach(
      (profile, index) => {

        let targetX = 0;
        let targetY = 0;

        let currentX = 0;
        let currentY = 0;

        let hovering = false;

        const floatOffset =
          index * 1.5;

        let currentHoverY = 0;

        let currentHoverZ = 0;

        let currentScale = 1;


        profile.addEventListener(
          "mouseenter",
          () => {

            hovering = true;

          }
        );


        profile.addEventListener(
          "mouseleave",
          () => {

            hovering = false;

            targetX = 0;
            targetY = 0;

          }
        );


        profile.addEventListener(
          "mousemove",
          (event) => {

            if (!hovering) return;

            const rect =
              profile.getBoundingClientRect();

            const x =
              event.clientX -
              rect.left;

            const y =
              event.clientY -
              rect.top;

            const centerX =
              rect.width / 2;

            const centerY =
              rect.height / 2;

            const normalizedX =
              (x - centerX) /
              centerX;

            const normalizedY =
              (y - centerY) /
              centerY;

            targetY =
              normalizedX * 10;

            targetX =
              -normalizedY * 10;

          }
        );


        function animateCard(time) {

          currentX +=
            (targetX - currentX) *
            0.045;

          currentY +=
            (targetY - currentY) *
            0.045;

          const float =
            Math.sin(
              time * 0.00065 +
              floatOffset
            ) * 8;

          const targetHoverY =
            hovering ? -12 : 0;

          currentHoverY +=
            (targetHoverY - currentHoverY) *
            0.025;

          const targetHoverZ =
            hovering ? 25 : 0;

          currentHoverZ +=
            (targetHoverZ - currentHoverZ) *
            0.025;

          const targetScale =
            hovering ? 1.025 : 1;

          currentScale +=
            (targetScale - currentScale) *
            0.025;

          profile.style.transform = `
            translateY(${float + currentHoverY}px)
            translateZ(${currentHoverZ}px)
            rotateX(${currentX}deg)
            rotateY(${currentY}deg)
            scale(${currentScale})
          `;

          requestAnimationFrame(
            animateCard
          );

        }


        requestAnimationFrame(
          animateCard
        );

      }
    );


    /* =========================
       GLOBAL ANIMATION
    ========================= */

    function animate() {

      glowX +=
        (mouseX - glowX) *
        0.06;

      glowY +=
        (mouseY - glowY) *
        0.06;

      cursorGlow.style.left =
        glowX + "px";

      cursorGlow.style.top =
        glowY + "px";


      currentTiltX +=
        (targetTiltX -
          currentTiltX) *
        0.04;

      currentTiltY +=
        (targetTiltY -
          currentTiltY) *
        0.04;


      if (scene) {

        scene.style.transform = `
          rotateX(${-currentTiltX}deg)
          rotateY(${currentTiltY}deg)
        `;

      }


      requestAnimationFrame(
        animate
      );

    }


    animate();


    /* =========================
       RESET CAMERA
    ========================= */

    document.addEventListener(
      "mouseleave",
      () => {

        targetTiltX = 0;

        targetTiltY = 0;

      }
    );


    /* =========================
       VIDEO ERROR
    ========================= */

    backgroundVideo.addEventListener(
      "error",
      () => {

        console.warn(
          "background.mp4 could not be loaded."
        );

      }
    );

  </script>

</body>
</html>
