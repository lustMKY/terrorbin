<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>terrorbin</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      background: #050505;

      color: white;

      font-family: Arial, sans-serif;

      overflow: hidden;
    }

    /* =========================
       TOP NAVIGATION
    ========================= */

    .top-nav {
      position: fixed;

      top: 15px;

      left: 50%;

      transform: translateX(-50%);

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 7px;

      z-index: 10000;
    }

    /* =========================
       NAV BUTTON
    ========================= */

    .nav-button {
      position: relative;

      min-width: 78px;

      height: 38px;

      padding: 0 17px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 10px;

      border:
        1px solid rgba(255, 255, 255, 0.12);

      background:
        rgba(10, 10, 10, 0.5);

      backdrop-filter: blur(10px);

      -webkit-backdrop-filter: blur(10px);

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.35),
        inset 0 0 25px rgba(255, 255, 255, 0.025);

      color: #aaa;

      text-decoration: none;

      font-size: 12px;

      font-weight: 500;

      letter-spacing: 1.5px;

      text-transform: uppercase;

      overflow: hidden;

      transition:
        color 0.35s ease,
        border-color 0.35s ease,
        box-shadow 0.5s ease,
        transform 0.7s ease;
    }

    /* =========================
       HOVER
    ========================= */

    .nav-button:hover {
      color: white;

      border-color:
        rgba(255, 255, 255, 0.35);

      box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.55),
        0 0 25px rgba(255, 255, 255, 0.08),
        inset 0 0 30px rgba(255, 255, 255, 0.045);

      transform:
        translateY(-4px)
        scale(1.03);

      text-shadow:
        0 0 12px rgba(255, 255, 255, 0.18);
    }

    /* =========================
       SHINE EFFECT
    ========================= */

    .nav-button::after {
      content: "";

      position: absolute;

      top: -100%;

      left: -80%;

      width: 55%;

      height: 300%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.055),
          transparent
        );

      transform: rotate(20deg);

      pointer-events: none;

      transition:
        left 0.8s ease;
    }

    .nav-button:hover::after {
      left: 125%;
    }

    /* =========================
       GLOW
    ========================= */

    .nav-button::before {
      content: "";

      position: absolute;

      width: 120px;

      height: 120px;

      top: -85px;

      left: 50%;

      transform:
        translateX(-50%);

      border-radius: 50%;

      background: white;

      opacity: 0.025;

      filter: blur(8px);

      transition:
        opacity 0.35s ease,
        transform 0.5s ease;
    }

    .nav-button:hover::before {
      opacity: 0.08;

      transform:
        translateX(-50%)
        scale(1.2);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .top-nav {
        top: 10px;

        gap: 5px;
      }

      .nav-button {
        min-width: 68px;

        height: 35px;

        padding: 0 12px;

        font-size: 10px;
      }

    }

  </style>
</head>

<body>

  <!-- =========================
       TOP NAVIGATION
  ========================= -->

  <nav class="top-nav">

    <!-- BIN -->

    <a
      href="index.html"
      class="nav-button"
    >
      Bin
    </a>

    <a
      href="paste.html"
      class="nav-button"
    >
      PASTE
    </a>


    <!-- HOR -->

    <a
      href="/"
      class="nav-button"
      onclick="window.location.href='/'; return false;"
    >
      HOR
    </a>


    <!-- PROFILES -->

    <a
      href="profiles.html"
      class="nav-button"
    >
      Profiles
    </a>

  </nav>

</body>
</html>
